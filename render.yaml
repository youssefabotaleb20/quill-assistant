# Render Blueprint: New > Blueprint, pick this repo, Apply.
# No API key is set on the server, so visitors use their own (bring your own key)
# and hosting costs nothing. Add ANTHROPIC_API_KEY here only if you want to pay
# for visitors' questions yourself.
services:
  - type: web
    name: quill-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: CLAUDE_MODEL
        value: claude-opus-5-5
      - key: CLAUDE_EFFORT
        value: medium
      - key: CORS_ORIGINS
        value: https://youssefabotaleb20.github.io
      - key: QUESTIONS_PER_HOUR
        value: "30"
