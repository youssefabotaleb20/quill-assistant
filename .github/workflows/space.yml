name: Deploy to Hugging Face Space

# Pushes a snapshot of main to a Hugging Face Space (Docker SDK), which builds
# the Dockerfile and serves the app for free. Skipped until the HF_SPACE
# variable (for example "your-hf-username/quill-assistant") and the HF_TOKEN
# secret (a write token) are set in the repo settings.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  deploy:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build a Space snapshot
        run: |
          # Spaces reject plain-git binary files, and the image rebuilds the
          # sample PDF anyway, so leave binaries out of the snapshot.
          find . -path ./.git -prune -o -type f \( -name '*.pdf' -o -name '*.png' \) -print -exec rm {} +
          # Spaces read their settings from front matter at the top of README.md.
          {
            printf -- '---\ntitle: Quill\nemoji: 📄\ncolorFrom: yellow\ncolorTo: red\nsdk: docker\napp_port: 7860\npinned: false\nlicense: mit\nshort_description: Ask a PDF or CSV questions with Claude\n---\n\n'
            cat README.md
          } > README.space.md
          mv README.space.md README.md
          rm -rf .git
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from GitHub"
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add an HF_TOKEN repository secret (a Hugging Face write token)."
            exit 1
          fi
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
