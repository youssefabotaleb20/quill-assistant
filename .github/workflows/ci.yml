name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        run: pytest -q

  docker:
    # Build the deploy image and check it starts and serves the app.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quill .
      - name: Smoke test
        run: |
          docker run -d --name quill -p 7860:7860 quill
          for i in $(seq 1 30); do curl -fs localhost:7860/api/health && break; sleep 1; done
          curl -fs localhost:7860/api/health | grep -q '"key_required":true'
          curl -fs localhost:7860/ | grep -q '<title>Quill'
          curl -fs -X POST localhost:7860/api/samples/report | grep -q '"pages":2'
          docker logs quill
